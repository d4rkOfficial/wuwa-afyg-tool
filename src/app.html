<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="椰果工具箱" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <script>
            /*
             * 手机端重定向到横屏壳页 /shell-page。
             *
             * 为什么放在 app.html：/ 是 prerender 出来的静态页（见 routes/+page.ts），
             * 运行时不会进 hooks.server.ts，服务端重定向对它天然失效；
             * 这里的脚本跑在 SvelteKit 启动之前，跳转发生在首屏渲染前，不动预渲染架构。
             *
             * 四条不跳规则（缺一条就会出事）：
             *   1. 已经在 /shell-page —— 否则自己跳自己无限循环；
             *   2. 处在 iframe 里 —— 壳页 iframe 加载的正是同一个 /，
             *      靠 window.self !== window.top 判定（比 document.referrer 可靠：
             *      严格 referrer-policy 下 referrer 可能为空，空值会导致无限循环）。
             *      这条同时覆盖 B 站 Toy 容器（它也是用 iframe 引入本工具）；
             *   3. 已安装的 PWA（standalone）—— 用户刻意装到桌面，不该被塞进浏览器全屏壳页；
             *   4. 非手机 UA / 不支持全屏方向锁的环境 —— 跳过去也切不了横屏，只会多一层遮罩。
             */
            try {
                var shellCtx = {
                    pathname: location.pathname,
                    inIframe: window.self !== window.top,
                    standalone:
                        window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true,
                    userAgent: navigator.userAgent || '',
                    viewportWidth: window.innerWidth || 0,
                    coarsePointer: window.matchMedia('(pointer: coarse)').matches,
                    canLockOrientation:
                        typeof screen.orientation === 'object' &&
                        screen.orientation !== null &&
                        typeof screen.orientation.lock === 'function' &&
                        typeof document.documentElement.requestFullscreen === 'function'
                }
                /*
                 * 手机判定：UA 命中移动端关键字，且是窄屏 + 粗指针。
                 * 注意 iOS Safari 默认「请求桌面网站」时 UA 与桌面一致，此路径判不出来（已知取舍）。
                 */
                var isMobileDevice = /Android|iPhone|iPod|Windows Phone|HarmonyOS|Mobile Safari/i.test(
                    shellCtx.userAgent
                )
                var shouldShell =
                    shellCtx.pathname !== '/shell-page' &&
                    shellCtx.pathname !== '/fast-calc' &&
                    !shellCtx.inIframe &&
                    !shellCtx.standalone &&
                    shellCtx.canLockOrientation &&
                    isMobileDevice &&
                    shellCtx.coarsePointer &&
                    shellCtx.viewportWidth > 0 &&
                    shellCtx.viewportWidth < 900
                if (shouldShell) location.replace('/shell-page' + location.search + location.hash)
            } catch (err) {
                /* 判定失败就正常打开主站，绝不因为跳转逻辑坏了而白屏 */
            }
        </script>
        <script>
            try {
                if (sessionStorage.getItem('wuwa-afyg:splash')) {
                    document.documentElement.classList.add('splash-skip')
                } else {
                    sessionStorage.setItem('wuwa-afyg:splash', '1')
                }
            } catch (e) {}
            /*
             * 开屏用纯黑 / 纯白两套（不跟配色，只跟主题）。判定顺序：
             *   1. `wuwa-afyg:theme-mode` —— 主题的 **localStorage 同步镜像**（theme store 写的）；
             *      主题本体在 IndexedDB 里是异步的，没有这份镜像就只能按系统猜，
             *      用户手动切过昼夜后会出现「开屏深色 → 进 App 浅色」。
             *   2. 系统 `prefers-color-scheme`（首次进入、或镜像还没写出来时）；
             *   3. 兜底深色（与 DEFAULT_ACTIVE_ID 一致）。
             * 结果以 class 挂在 <html> 上，CSS 里两套规则分别命中；这段跑在首屏绘制之前。
             */
            try {
                var savedMode = null
                try {
                    savedMode = localStorage.getItem('wuwa-afyg:theme-mode')
                } catch (e) {}
                var light =
                    savedMode === 'light' ||
                    (savedMode !== 'dark' &&
                        typeof window.matchMedia === 'function' &&
                        window.matchMedia('(prefers-color-scheme: light)').matches)
                document.documentElement.classList.add(light ? 'splash-light' : 'splash-dark')
            } catch (e) {
                document.documentElement.classList.add('splash-dark')
            }
            window.__splashStart = performance.now()
            window.addEventListener('load', () => {
                const el = document.getElementById('splash')
                if (el && performance.now() - window.__splashStart > 1500) {
                    el.classList.add('splash-hidden')
                    setTimeout(() => el.remove(), 500)
                }
            })
        </script>
        <style>
            /* ── 开屏（splash）──
               只有一个居中的加载环：底色与环色都是**纯黑 / 纯白**，不取主题的强调色（配色），
               只区分昼夜。昼夜由 <html> 上的 `splash-light` / `splash-dark` 决定
               （内联脚本在首屏绘制前按「主题的 localStorage 同步镜像 → 系统 → 深色兜底」判定）。
               深色（默认）：底 `#000` / 环 `#fff`；浅色：底 `#fff` / 环 `#000`。
               由来：原先这里是靛紫底 + 椰子 logo + 标题 + 小加载环，按用户要求改成
               「纯黑白、去掉所有文本、只要一个放大的居中图标」。 */
            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
                transition: opacity 0.4s ease;
            }
            #splash .splash-spinner {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.22);
                border-top-color: #ffffff;
                animation: splash-spin 0.9s linear infinite;
            }
            html.splash-light #splash {
                background: #ffffff;
            }
            html.splash-light #splash .splash-spinner {
                border-color: rgba(0, 0, 0, 0.15);
                border-top-color: #000000;
            }
            #splash.splash-hidden {
                opacity: 0;
                pointer-events: none;
            }
            html.splash-skip #splash {
                display: none;
            }
            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="splash">
            <div class="splash-spinner"></div>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
