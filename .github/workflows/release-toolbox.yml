name: Release toolbox static

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-toolbox
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static bundle
        run: pnpm run build
        env:
          DEPLOY_TARGET: static

      - name: Package release assets
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test -f build/index.html
          node scripts/write-static-manifest.mjs
          tar -czf toolbox.tar.gz -C build .
          cp build/manifest.json manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: toolbox-${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" toolbox.tar.gz manifest.json --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" toolbox.tar.gz manifest.json \
              --title "Toolbox ${GITHUB_SHA::7}" \
              --notes "Automated static build from ${GITHUB_SHA}" \
              --latest
          fi
